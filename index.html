<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>M6 MIDI Editor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <h1>M6 MIDI Editor</h1>
    <div class="editor-area">
      <div class="left-section">
        <div class="image-container">
          <img src="m6.jpg" alt="M6 MIDI Pedal" />
          <!-- ปุ่ม 1-6 ใช้หน่วย % เพื่อล็อกตำแหน่งสัมพันธ์กับรูปภาพ -->
          <button class="button" id="btn1" style="top: 5.5%; left: 5.09%;" data-button="1">1</button>
          <button class="button" id="btn2" style="top: 5.5%; left: 46.36%;" data-button="2">2</button>
          <button class="button" id="btn3" style="top: 5.5%; left: 87.64%;" data-button="3">3</button>
          <button class="button" id="btn4" style="top: 85%; left: 5.09%;" data-button="4">4</button>
          <button class="button" id="btn5" style="top: 85%; left: 46.36%;" data-button="5">5</button>
          <button class="button" id="btn6" style="top: 85%; left: 87.64%;" data-button="6">6</button>

          <!-- ตัวอักษรสำหรับ SW-<button number> หรือ Screen Text -->
          <div class="switch-label" id="switchLabel" style="display: none;"></div>

          <!-- แถบสี 2 ชิ้น -->
          <div class="color-bar-container" id="colorBarContainer">
            <div class="color-bar-top" id="colorBarTop"></div>
            <div class="color-bar-bottom" id="colorBarBottom"></div>
            <input type="color" class="color-picker" id="colorPicker">
          </div>
          <!-- แถบตัวเลือก Bank -->
          <div class="bank-selector" id="bankSelector">
            <button class="bank-button" id="bankButton">Bank 1</button>
            <div class="bank-popup" id="bankPopup" style="display: none;">
              <button class="bank-option" data-bank="Bank 1">Bank 1</button>
              <button class="bank-option" data-bank="Bank 2">Bank 2</button>
              <button class="bank-option" data-bank="Bank 3">Bank 3</button>
              <button class="bank-option" data-bank="Bank 4">Bank 4</button>
            </div>
          </div>
        </div>
        <div class="save-button-container">
          <button type="submit" form="settings-form" id="save-settings-btn">Save Settings</button>
        </div>
      </div>

      <form class="settings-form" id="settings-form">
        <!-- Mode -->
        <label for="mode">Mode:</label>
        <select id="mode">
          <option value="single-step-single-bank">Single step (single Bank information)</option>
          <option value="single-step-two-banks">Single step (switch between two Banks)</option>
          <option value="press-down-release">Press down - release (Two sets of information)</option>
          <option value="long-step">Long step / Short or Long</option>
        </select>

        <!-- Message Type -->
        <label for="message">Message Type:</label>
        <div class="message-type-container">
          <select id="message" class="message-type">
            <option value="pc">Program Change (PC)</option>
            <option value="cc">Control Change (CC)</option>
            <option value="note">Note On/Off</option>
          </select>

          <!-- MIDI Channel -->
          <div class="message-options">
            <label for="channel">MIDI Channel:</label>
            <input type="number" id="channel" min="1" max="16" value="1" />
          </div>

          <!-- A/B Bank Tabs (สำหรับบางโหมด) -->
          <div class="bank-tabs" id="bankTabs" style="display: none;">
            <button type="button" class="bank-tab active" data-tab="bank-a">A Bank</button>
            <button type="button" class="bank-tab" data-tab="bank-b">B Bank</button>
          </div>

          <!-- ส่วนย่อยของ Message Type -->
          <div id="pc-options" class="message-options">
            <label for="pc-number">PC Number (0-127):</label>
            <input type="number" id="pc-number-a" min="0" max="127" value="0" data-bank="a" />
            <input type="number" id="pc-number-b" min="0" max="127" value="0" data-bank="b" style="display: none;" />
          </div>

          <div id="cc-options" class="message-options" style="display:none;">
            <label for="cc-number">CC Number (0-127):</label>
            <input type="number" id="cc-number-a" min="0" max="127" value="0" data-bank="a" />
            <input type="number" id="cc-number-b" min="0" max="127" value="0" data-bank="b" style="display: none;" />
            <label for="cc-value">CC Value (0-127):</label>
            <input type="number" id="cc-value-a" min="0" max="127" value="0" data-bank="a" />
            <input type="number" id="cc-value-b" min="0" max="127" value="0" data-bank="b" style="display: none;" />
          </div>

          <div id="note-options" class="message-options" style="display:none;">
            <label for="note-number">Note Number (0-127):</label>
            <input type="number" id="note-number-a" min="0" max="127" value="60" data-bank="a" />
            <input type="number" id="note-number-b" min="0" max="127" value="60" data-bank="b" style="display: none;" />
            <label for="note-velocity">Note Velocity (0-127):</label>
            <input type="number" id="note-velocity-a" min="0" max="127" value="100" data-bank="a" />
            <input type="number" id="note-velocity-b" min="0" max="127" value="100" data-bank="b" style="display: none;" />
          </div>
        </div>

        <!-- Screen Text -->
        <label for="screen-text-a">Screen Text A:</label>
        <input type="text" id="screen-text-a" data-bank="a" placeholder="Enter text for A (optional)" />
        <label for="screen-text-b" id="screen-text-b-label" style="display: none;">Screen Text B:</label>
        <input type="text" id="screen-text-b" data-bank="b" placeholder="Enter text for B (optional)" style="display: none;" />

        <!-- Screen Color -->
        <label for="screen-color-a">Screen Color A:</label>
        <input type="color" id="screen-color-a" value="#00ff00" data-bank="a" />
        <label for="screen-color-b" id="screen-color-b-label" style="display: none;">Screen Color B:</label>
        <input type="color" id="screen-color-b" value="#0000ff" data-bank="b" style="display: none;" />
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
