<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P6 MIDI Editor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 20px;
        }
        .left-panel {
            flex: 0 0 350px;
        }
        .right-panel {
            flex: 1;
            max-height: 80vh;
            overflow-y: auto;
        }
        .alert {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: none;
        }
        .alert.success { background-color: #d4edda; color: #155724; }
        .alert.error { background-color: #f8d7da; color: #721c24; }
        .alert.info { background-color: #d1ecf1; color: #0c5460; }
        .connection-status {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .connected { color: green; }
        .connected.bluetooth { color: #17a2b8; }
        .disconnected { color: red; }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            margin: 20px 0;
        }
        .button {
            width: 100px;
            height: 100px;
            border: 2px solid #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            text-align: center;
            background-color: #fff;
        }
        .button.active {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        .bank-selector {
            margin-bottom: 10px;
        }
        select, input, button {
            padding: 8px;
            margin: 5px 0;
            border-radius: 4px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }
        #connectBluetoothButton {
            margin-top: 10px;
            background-color: #17a2b8;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        button:hover:not(:disabled) {
            background-color: #0056b3;
        }
        #connectBluetoothButton:hover:not(:disabled) {
            background-color: #138496;
        }
        .settings-form {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .settings-form label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }
        .field-group {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #e9ecef;
            border-radius: 4px;
        }
        .field-group h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #007bff;
        }
        .cc-message-group {
            margin: 10px 0;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .cc-message-group label {
            display: inline-block;
            width: 120px;
        }
        .cc-message-group input {
            width: 80px;
            margin-right: 10px;
        }
        .sw-info-texts {
            margin-top: 20px;
        }
        .sw-info-texts label {
            display: block;
            margin: 5px 0 2px;
        }
        .sw-info-texts input {
            width: 100%;
            max-width: 200px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <div id="connectionStatus" class="connection-status disconnected">Disconnected</div>
            <button id="connectButton">Connect to Serial</button>
            <button id="connectBluetoothButton">Connect to Bluetooth</button>
            <button id="loadButton" disabled>Load Settings</button>
            <button id="clearEEPROMButton" disabled>Clear EEPROM</button>
            <div id="alert" class="alert"></div>
            <div>Current Bank: <span id="currentBankDisplay">N/A</span></div>
            <div>Current Button: <span id="currentButtonDisplay">N/A</span></div>
            <div class="bank-selector">
                <select id="bankSelect">
                    <option value="Bank 1">Bank 1</option>
                    <option value="Bank 2">Bank 2</option>
                    <option value="Bank 3">Bank 3</option>
                    <option value="Bank 4">Bank 4</option>
                </select>
            </div>
            <div class="button-grid">
                <div class="button" data-button="1">Button 1</div>
                <div class="button" data-button="2">Button 2</div>
                <div class="button" data-button="3">Button 3</div>
                <div class="button" data-button="4">Button 4</div>
                <div class="button" data-button="5">Button 5</div>
                <div class="button" data-button="6">Button 6</div>
            </div>
            <div class="sw-info-texts">
                <h3>Sw-Info Texts</h3>
                <label for="swInfoText1">SW-1 Text:</label>
                <input type="text" id="swInfoText1" maxlength="15" value="">
                <label for="swInfoText2">SW-2 Text:</label>
                <input type="text" id="swInfoText2" maxlength="15" value="">
                <label for="swInfoText3">SW-3 Text:</label>
                <input type="text" id="swInfoText3" maxlength="15" value="">
                <label for="swInfoText4">SW-4 Text:</label>
                <input type="text" id="swInfoText4" maxlength="15" value="">
                <label for="swInfoText5">SW-5 Text:</label>
                <input type="text" id="swInfoText5" maxlength="15" value="">
                <label for="swInfoText6">SW-6 Text:</label>
                <input type="text" id="swInfoText6" maxlength="15" value="">
            </div>
        </div>
        <div class="right-panel">
            <form id="settings-form" class="settings-form">
                <label for="mode">Mode:</label>
                <select id="mode">
                    <option value="single">Single Step (Single Bank)</option>
                    <option value="switch">Single Step (Two Banks)</option>
                    <option value="press">Press Down/Release</option>
                    <option value="longstep">Long Step</option>
                </select>

                <div class="field-group">
                    <h3>Bank A Settings</h3>
                    <label for="messageTypeA">Message Type A:</label>
                    <select id="messageTypeA">
                        <option value="PC">Program Change (PC)</option>
                        <option value="CC">Control Change (CC)</option>
                        <option value="NOTE">Note</option>
                    </select>
                    <label for="channelA">Channel A:</label>
                    <input type="number" id="channelA" min="1" max="16" value="1">
                    <div id="bankAFields">
                        <div id="ccMessagesA" class="cc-message-group" style="display: none;">
                            <h4>CC Messages (Bank A)</h4>
                            <div>
                                <label>Message 1 - Control:</label>
                                <input type="number" class="cc-control-a" data-index="0" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-a" data-index="0" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 2 - Control:</label>
                                <input type="number" class="cc-control-a" data-index="1" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-a" data-index="1" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 3 - Control:</label>
                                <input type="number" class="cc-control-a" data-index="2" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-a" data-index="2" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 4 - Control:</label>
                                <input type="number" class="cc-control-a" data-index="3" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-a" data-index="3" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 5 - Control:</label>
                                <input type="number" class="cc-control-a" data-index="4" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-a" data-index="4" min="0" max="127" value="0">
                            </div>
                        </div>
                        <div id="dataFieldsA">
                            <label id="dataALabel">Data A:</label>
                            <input type="number" id="dataA" min="0" max="127" value="0">
                            <label id="valueALabel" style="display: none;">Value A:</label>
                            <input type="number" id="valueA" min="0" max="127" value="0" style="display: none;">
                        </div>
                    </div>
                    <label for="screenTextA">Screen Text A:</label>
                    <input type="text" id="screenTextA" maxlength="15" value="">
                    <label for="screenColorA">Screen Color A:</label>
                    <input type="color" id="screenColorA" value="#FFFF00">
                </div>

                <div class="field-group" id="bankBSettings">
                    <h3>Bank B Settings</h3>
                    <label for="messageTypeB">Message Type B:</label>
                    <select id="messageTypeB">
                        <option value="PC">Program Change (PC)</option>
                        <option value="CC">Control Change (CC)</option>
                        <option value="NOTE">Note</option>
                    </select>
                    <label for="channelB">Channel B:</label>
                    <input type="number" id="channelB" min="1" max="16" value="1">
                    <div id="bankBFields">
                        <div id="ccMessagesB" class="cc-message-group" style="display: none;">
                            <h4>CC Messages (Bank B)</h4>
                            <div>
                                <label>Message 1 - Control:</label>
                                <input type="number" class="cc-control-b" data-index="0" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-b" data-index="0" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 2 - Control:</label>
                                <input type="number" class="cc-control-b" data-index="1" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-b" data-index="1" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 3 - Control:</label>
                                <input type="number" class="cc-control-b" data-index="2" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-b" data-index="2" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 4 - Control:</label>
                                <input type="number" class="cc-control-b" data-index="3" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-b" data-index="3" min="0" max="127" value="0">
                            </div>
                            <div>
                                <label>Message 5 - Control:</label>
                                <input type="number" class="cc-control-b" data-index="4" min="0" max="127" value="0">
                                <label>Value:</label>
                                <input type="number" class="cc-value-b" data-index="4" min="0" max="127" value="0">
                            </div>
                        </div>
                        <div id="dataFieldsB">
                            <label id="dataBLabel">Data B:</label>
                            <input type="number" id="dataB" min="0" max="127" value="0">
                            <label id="valueBLabel" style="display: none;">Value B:</label>
                            <input type="number" id="valueB" min="0" max="127" value="0" style="display: none;">
                        </div>
                    </div>
                    <label for="screenTextB">Screen Text B:</label>
                    <input type="text" id="screenTextB" maxlength="15" value="">
                    <label for="screenColorB">Screen Color B:</label>
                    <input type="color" id="screenColorB" value="#FFFF00">
                </div>

                <button type="button" id="saveButton" disabled>Save Settings</button>
            </form>
        </div>
    </div>

    <script>
        // === Global Variables ===
        let port, reader, writer;
        let isConnected = false;
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;
        let bluetoothConnected = false;
        let activeButton = null;
        let currentBank = 'Bank 1';
        let readLoopRunning = false;
        let bluetoothBuffer = '';
        let pendingResponse = null; // Track expected response

        const connectionStatus = document.getElementById("connectionStatus");
        const connectButton = document.getElementById("connectButton");
        const connectBluetoothButton = document.getElementById("connectBluetoothButton");
        const loadButton = document.getElementById("loadButton");
        const saveButton = document.getElementById("saveButton");
        const clearEEPROMButton = document.getElementById("clearEEPROMButton");
        const alertBox = document.getElementById("alert");
        const currentBankDisplay = document.getElementById("currentBankDisplay");
        const currentButtonDisplay = document.getElementById("currentButtonDisplay");
        const bankSelect = document.getElementById("bankSelect");
        const modeSelect = document.getElementById("mode");
        const messageTypeA = document.getElementById("messageTypeA");
        const messageTypeB = document.getElementById("messageTypeB");
        const channelA = document.getElementById("channelA");
        const channelB = document.getElementById("channelB");
        const dataA = document.getElementById("dataA");
        const dataB = document.getElementById("dataB");
        const valueA = document.getElementById("valueA");
        const valueB = document.getElementById("valueB");
        const dataALabel = document.getElementById("dataALabel");
        const valueALabel = document.getElementById("valueALabel");
        const dataBLabel = document.getElementById("dataBLabel");
        const valueBLabel = document.getElementById("valueBLabel");
        const bankBSettings = document.getElementById("bankBSettings");
        const ccMessagesA = document.getElementById("ccMessagesA");
        const ccMessagesB = document.getElementById("ccMessagesB");
        const dataFieldsA = document.getElementById("dataFieldsA");
        const dataFieldsB = document.getElementById("dataFieldsB");
        const screenTextA = document.getElementById("screenTextA");
        const screenTextB = document.getElementById("screenTextB");
        const screenColorA = document.getElementById("screenColorA");
        const screenColorB = document.getElementById("screenColorB");
        const swInfoTextInputs = {
            1: document.getElementById("swInfoText1"),
            2: document.getElementById("swInfoText2"),
            3: document.getElementById("swInfoText3"),
            4: document.getElementById("swInfoText4"),
            5: document.getElementById("swInfoText5"),
            6: document.getElementById("swInfoText6")
        };

        // Mode mapping for ESP32
        const modeMap = {
            '1': 'single',
            '2': 'switch',
            '3': 'press',
            '4': 'longstep'
        };

        // Bluetooth UUIDs for Nordic UART Service
        const UART_SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_RX_CHARACTERISTIC_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
        const UART_TX_CHARACTERISTIC_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

        // Data structures
        const buttonSettings = {
            'Bank 1': {}, 'Bank 2': {}, 'Bank 3': {}, 'Bank 4': {}
        };
        const buttonColors = {
            'Bank 1': {}, 'Bank 2': {}, 'Bank 3': {}, 'Bank 4': {}
        };
        const buttonBankStates = {
            'Bank 1': {}, 'Bank 2': {}, 'Bank 3': {}, 'Bank 4': {}
        };
        const swInfoTexts = {
            'Bank 1': {}, 'Bank 2': {}, 'Bank 3': {}, 'Bank 4': {}
        };

        // Initialize button settings
        document.querySelectorAll('.button').forEach(button => {
            const buttonNum = button.getAttribute('data-button');
            ['Bank 1', 'Bank 2', 'Bank 3', 'Bank 4'].forEach(bank => {
                buttonSettings[bank][buttonNum] = {
                    mode: 'single',
                    messageType: { a: 'PC', b: 'PC' },
                    channel: { a: 1, b: 1 },
                    data: { a: 0, b: 0 },
                    value: { a: 0, b: 0 },
                    screenText: { a: '', b: '' },
                    ccMessages: {
                        a: [
                            { control: 0, value: 0 },
                            { control: 0, value: 0 },
                            { control: 0, value: 0 },
                            { control: 0, value: 0 },
                            { control: 0, value: 0 }
                        ],
                        b: [
                            { control: 0, value: 0 },
                            { control: 0, value: 0 },
                            { control: 0, value: 0 },
                            { control: 0, value: 0 },
                            { control: 0, value: 0 }
                        ]
                    }
                };
                buttonColors[bank][buttonNum] = { a: '#FFFF00', b: '#FFFF00' };
                buttonBankStates[bank][buttonNum] = 'A';
                swInfoTexts[bank][buttonNum] = `SW-${buttonNum}`;
            });
        });

        // === Utility Functions ===
        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';
            setTimeout(() => alertBox.style.display = 'none', 7000);
        }

        function updateFieldsBasedOnMessageType(bank, messageType, dataInput, valueInput, dataLabel, valueLabel, ccMessagesDiv, dataFieldsDiv) {
            const isCC = messageType === 'CC';
            ccMessagesDiv.style.display = isCC ? 'block' : 'none';
            dataFieldsDiv.style.display = isCC ? 'none' : 'block';
            dataLabel.style.display = isCC ? 'none' : 'block';
            valueLabel.style.display = isCC ? 'none' : (messageType === 'PC' ? 'none' : 'block');
            dataInput.style.display = isCC ? 'none' : 'block';
            valueInput.style.display = isCC ? 'none' : (messageType === 'PC' ? 'none' : 'block');
            if (messageType === 'PC') {
                dataLabel.textContent = 'Program Number:';
            } else if (messageType === 'NOTE') {
                dataLabel.textContent = 'Note Number:';
                valueLabel.textContent = 'Velocity:';
            }
        }

        function updateBankBVisibility() {
            const mode = modeSelect.value;
            const showBankB = mode === 'switch' || mode === 'press' || mode === 'longstep';
            bankBSettings.style.display = showBankB ? 'block' : 'none';
        }

        async function checkPortStatus() {
            if (!port || !isConnected) return false;
            try {
                const signals = await port.getSignals();
                return true;
            } catch (error) {
                console.log('DEBUG: Port status check failed:', error);
                return false;
            }
        }

        // === Serial Connection ===
        async function connectSerial() {
            if (!navigator.serial) {
                showAlert('Web Serial API ไม่รองรับ กรุณาใช้ Chrome, Edge หรือ Opera ล่าสุด', 'error');
                return;
            }
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                showAlert('ต้องรันผ่าน HTTPS หรือ localhost เพื่อใช้ Web Serial API', 'error');
                return;
            }
            try {
                if (isConnected) {
                    showAlert('เชื่อมต่อ Serial อยู่แล้ว กรุณายกเลิกการเชื่อมต่อก่อน', 'error');
                    return;
                }
                if (bluetoothConnected) {
                    showAlert('กรุณายกเลิกการเชื่อมต่อ Bluetooth ก่อน', 'error');
                    return;
                }
                port = await navigator.serial.requestPort();
                if (!port) {
                    showAlert('ไม่ได้เลือกพอร์ต Serial กรุณาเลือกพอร์ต', 'error');
                    return;
                }
                await port.open({ baudRate: 115200 });
                writer = port.writable.getWriter();
                reader = port.readable.getReader();
                isConnected = true;
                readLoopRunning = true;
                connectionStatus.textContent = 'เชื่อมต่อผ่าน Serial';
                connectionStatus.classList.remove('disconnected');
                connectionStatus.classList.add('connected', 'serial');
                connectButton.textContent = 'ยกเลิกการเชื่อมต่อ Serial';
                loadButton.disabled = false;
                saveButton.disabled = false;
                clearEEPROMButton.disabled = false;
                showAlert('เชื่อมต่อพอร์ต Serial สำเร็จ!', 'success');
                readLoop();
                sendCommand('GET_STATUS\n');
            } catch (error) {
                showAlert(`ไม่สามารถเชื่อมต่อ Serial ได้: ${error.message}`, 'error');
                await disconnectSerial();
            }
        }

        async function disconnectSerial() {
            try {
                readLoopRunning = false;
                if (reader) {
                    await reader.cancel().catch(() => {});
                    reader.releaseLock();
                    reader = null;
                }
                if (writer) {
                    writer.releaseLock();
                    writer = null;
                }
                if (port) {
                    await port.close();
                    port = null;
                }
                isConnected = false;
                connectionStatus.textContent = 'ไม่ได้เชื่อมต่อ';
                connectionStatus.classList.remove('connected', 'serial');
                connectionStatus.classList.add('disconnected');
                connectButton.textContent = 'Connect to Serial';
                loadButton.disabled = true;
                saveButton.disabled = true;
                clearEEPROMButton.disabled = true;
                showAlert('ยกเลิกการเชื่อมต่อ Serial สำเร็จ', 'info');
            } catch (error) {
                showAlert(`ข้อผิดพลาดในการยกเลิกการเชื่อมต่อ Serial: ${error.message}`, 'error');
            }
        }

        // === Bluetooth Connection ===
        async function connectBluetooth() {
            if (!navigator.bluetooth) {
                showAlert('Web Bluetooth API ไม่รองรับ กรุณาใช้ Chrome หรือ Edge ล่าสุด', 'error');
                return;
            }
            if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
                showAlert('ต้องรันผ่าน HTTPS หรือ localhost เพื่อใช้ Web Bluetooth API', 'error');
                return;
            }
            try {
                if (bluetoothConnected) {
                    showAlert('กำลังเชื่อมต่อ Bluetooth อยู่ กรุณายกเลิกการเชื่อมต่อก่อน', 'error');
                    return;
                }
                if (isConnected) {
                    showAlert('กรุณายกเลิกการเชื่อมต่อ Serial ก่อนเชื่อมต่อ Bluetooth', 'error');
                    return;
                }
                console.log('DEBUG: Starting Bluetooth connection process...');
                showAlert('กำลังค้นหาอุปกรณ์ Bluetooth (P6_MIDI)...', 'info');
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'P6_MIDI' }],
                    optionalServices: [UART_SERVICE_UUID]
                });
                console.log('DEBUG: Device selected:', bluetoothDevice.name, 'ID:', bluetoothDevice.id);
                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    console.log('DEBUG: Bluetooth GATT server disconnected');
                    disconnectBluetooth();
                });
                showAlert('กำลังเชื่อมต่อกับ GATT server...', 'info');
                const server = await bluetoothDevice.gatt.connect();
                console.log('DEBUG: Connected to GATT server');
                showAlert('กำลังค้นหา Nordic UART Service...', 'info');
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                console.log('DEBUG: UART Service found with UUID:', UART_SERVICE_UUID);
                showAlert('กำลังตั้งค่า RX/TX Characteristics...', 'info');
                bluetoothCharacteristic = await service.getCharacteristic(UART_RX_CHARACTERISTIC_UUID);
                const notifyCharacteristic = await service.getCharacteristic(UART_TX_CHARACTERISTIC_UUID);
                console.log('DEBUG: RX Characteristic:', UART_RX_CHARACTERISTIC_UUID, 'TX Characteristic:', UART_TX_CHARACTERISTIC_UUID);
                await notifyCharacteristic.startNotifications();
                notifyCharacteristic.addEventListener('characteristicvaluechanged', handleBluetoothData);
                bluetoothConnected = true;
                connectionStatus.textContent = 'เชื่อมต่อผ่าน Bluetooth';
                connectionStatus.classList.remove('disconnected');
                connectionStatus.classList.add('connected', 'bluetooth');
                connectBluetoothButton.textContent = 'ยกเลิกการเชื่อมต่อ Bluetooth';
                loadButton.disabled = false;
                saveButton.disabled = false;
                clearEEPROMButton.disabled = false;
                showAlert('เชื่อมต่อ Bluetooth กับ P6_MIDI สำเร็จ!', 'success');
                console.log('DEBUG: Sending initial GET_STATUS command via Bluetooth');
                await sendCommand('GET_STATUS\n', true);
            } catch (error) {
                console.error('DEBUG: Bluetooth connection failed:', error);
                showAlert(`ไม่สามารถเชื่อมต่อ Bluetooth ได้: ${error.message}`, 'error');
                await disconnectBluetooth();
            }
        }

        async function disconnectBluetooth() {
            try {
                if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                    console.log('DEBUG: Disconnecting Bluetooth GATT server...');
                    await bluetoothDevice.gatt.disconnect();
                } else {
                    console.log('DEBUG: No active Bluetooth GATT connection to disconnect');
                }
                bluetoothDevice = null;
                bluetoothCharacteristic = null;
                bluetoothConnected = false;
                bluetoothBuffer = '';
                pendingResponse = null;
                connectionStatus.textContent = 'ไม่ได้เชื่อมต่อ';
                connectionStatus.classList.remove('connected', 'bluetooth');
                connectionStatus.classList.add('disconnected');
                connectBluetoothButton.textContent = 'Connect to Bluetooth';
                loadButton.disabled = true;
                saveButton.disabled = true;
                clearEEPROMButton.disabled = true;
                showAlert('ยกเลิกการเชื่อมต่อ Bluetooth สำเร็จ', 'info');
                console.log('DEBUG: Bluetooth disconnection completed');
            } catch (error) {
                console.error('DEBUG: Bluetooth disconnection error:', error);
                showAlert(`ข้อผิดพลาดในการยกเลิกการเชื่อมต่อ Bluetooth: ${error.message}`, 'error');
            }
        }

        function handleBluetoothData(event) {
            const value = event.target.value;
            const text = new TextDecoder().decode(value);
            console.log('DEBUG: Received Bluetooth data:', text);
            bluetoothBuffer += text;
            const lines = bluetoothBuffer.split('\n');
            bluetoothBuffer = lines.pop();
            for (const line of lines) {
                const trimmedLine = line.trim();
                if (trimmedLine) {
                    console.log('DEBUG: Processing Bluetooth line:', trimmedLine);
                    processReceivedData(trimmedLine);
                }
            }
        }

        // === Serial Communication ===
        async function readLoop() {
            let buffer = '';
            let retryCount = 0;
            const maxRetries = 3;
            while (isConnected && readLoopRunning && reader && !bluetoothConnected) {
                try {
                    const { value, done } = await reader.read();
                    if (done) {
                        await disconnectSerial();
                        break;
                    }
                    retryCount = 0;
                    const text = new TextDecoder().decode(value);
                    buffer += text;
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        const trimmedLine = line.trim();
                        if (trimmedLine) {
                            console.log('DEBUG: Received from Serial:', trimmedLine);
                            processReceivedData(trimmedLine);
                        }
                    }
                } catch (error) {
                    if (retryCount < maxRetries) {
                        retryCount++;
                        showAlert(`ข้อผิดพลาดในการอ่าน Serial (ครั้งที่ ${retryCount}/${maxRetries}): ${error.message}`, 'error');
                        await new Promise(resolve => setTimeout(resolve, 1000));
                        continue;
                    } else {
                        showAlert(`ข้อผิดพลาดในการอ่าน Serial หลังลอง ${maxRetries} ครั้ง: ${error.message}`, 'error');
                        await disconnectSerial();
                        break;
                    }
                }
            }
        }

        async function sendCommand(command, useBluetooth = false, expectedResponse = null, timeoutMs = 5000) {
            if (useBluetooth) {
                if (!bluetoothConnected || !bluetoothCharacteristic) {
                    showAlert('กรุณาเชื่อมต่อ Bluetooth ก่อนส่งคำสั่ง', 'error');
                    console.error('DEBUG: Bluetooth not connected or characteristic not initialized');
                    return false;
                }
                try {
                    if (typeof bluetoothCharacteristic.writeValueWithoutResponse !== 'function') {
                        showAlert('ข้อผิดพลาด: Bluetooth characteristic ไม่ถูกต้อง', 'error');
                        console.error('DEBUG: Invalid bluetoothCharacteristic:', bluetoothCharacteristic);
                        return false;
                    }
                    const maxChunkSize = 20;
                    const data = new TextEncoder().encode(command);
                    console.log('DEBUG: Command to send:', command.trim(), 'Length:', data.length);
                    pendingResponse = expectedResponse;
                    if (data.length <= maxChunkSize) {
                        await bluetoothCharacteristic.writeValueWithoutResponse(data);
                    } else {
                        for (let i = 0; i < data.length; i += maxChunkSize) {
                            const chunk = data.slice(i, i + maxChunkSize);
                            await bluetoothCharacteristic.writeValueWithoutResponse(chunk);
                            console.log('DEBUG: Sent chunk:', new TextDecoder().decode(chunk));
                            await new Promise(resolve => setTimeout(resolve, 20)); // Increased delay
                        }
                    }
                    console.log('DEBUG: Sent Bluetooth command:', command.trim());
                    if (expectedResponse) {
                        const responseReceived = await new Promise((resolve) => {
                            const timeout = setTimeout(() => resolve(false), timeoutMs);
                            const checkResponse = () => {
                                if (pendingResponse === null) {
                                    clearTimeout(timeout);
                                    resolve(true);
                                }
                            };
                            setInterval(checkResponse, 100);
                        });
                        if (!responseReceived) {
                            console.error('DEBUG: Timeout waiting for response:', expectedResponse);
                            return false;
                        }
                    }
                    return true;
                } catch (error) {
                    showAlert(`ไม่สามารถส่งคำสั่ง Bluetooth ได้: ${error.message}`, 'error');
                    console.error('DEBUG: Bluetooth write error:', error);
                    return false;
                }
            } else {
                if (!isConnected || !writer || !await checkPortStatus()) {
                    showAlert('กรุณาเชื่อมต่อพอร์ต Serial ก่อนส่งคำสั่ง', 'error');
                    console.error('DEBUG: Serial not connected');
                    return false;
                }
                try {
                    const data = new TextEncoder().encode(command);
                    await writer.write(data);
                    console.log('DEBUG: Sent Serial command:', command.trim());
                    return true;
                } catch (error) {
                    showAlert(`ไม่สามารถส่งคำสั่ง Serial ได้: ${error.message}`, 'error');
                    console.error('DEBUG: Serial write error:', error);
                    return false;
                }
            }
        }

        // === Process Received Data ===
        function processReceivedData(text) {
            if (!text) {
                console.log('DEBUG: Empty data received');
                return;
            }
            if (text.match(/SET_OK/i)) {
                showAlert('บันทึกการตั้งค่าสำเร็จ!', 'success');
                pendingResponse = null;
                loadSettings();
                return;
            }
            if (text.match(/CLEAR_OK/i) || text.match(/EEPROM_CLEARED/i)) {
                showAlert('ล้าง EEPROM สำเร็จ!', 'success');
                pendingResponse = null;
                loadSettings();
                return;
            }
            if (text.match(/ERROR|Invalid|WARNING/i)) {
                showAlert(`ESP32 ตอบกลับข้อผิดพลาด: ${text}`, 'error');
                pendingResponse = null;
                return;
            }
            const statusRegex = /STATUS:(\d+)\|(\d+)\|((?:\d+:[1-4],(?:PC|CC|NOTE)?,[^,]*,\d*,(?:\d*,)?\d*,(?:PC|CC|NOTE)?,[^,]*,\d*,(?:\d*,)?\d*,[^,|]*,[^,|]*,[^,|]*,[0-9A-F]{6},[0-9A-F]{6},[AB]\|)+)/i;
            const match = text.match(statusRegex);
            if (match) {
                const [, bank, currentButton, buttonData] = match;
                const bankNum = parseInt(bank);
                const currentButtonNum = parseInt(currentButton);
                if (bankNum < 1 || bankNum > 4) {
                    showAlert(`หมายเลข Bank ไม่ถูกต้อง: ${bankNum}`, 'error');
                    return;
                }
                currentBank = `Bank ${bankNum}`;
                currentBankDisplay.textContent = bankNum;
                currentButtonDisplay.textContent = currentButtonNum;
                bankSelect.value = currentBank;
                const buttonRegex = /(\d+):([1-4]),([A-Z]{0,4}),([^,]*),([^,]*),([^,]*),([A-Z]{0,4}),([^,]*),([^,]*),([^,]*),([^,|]*),([^,|]*),([^,|]*),([0-9A-F]{6}),([0-9A-F]{6}),([AB])/gi;
                let buttonMatch;
                while ((buttonMatch = buttonRegex.exec(buttonData))) {
                    const [
                        , buttonNum, modeNum, typeA, data1A, valueAOpt, channelA, typeB, data1B, valueBOpt, channelB,
                        screenTextAVal, screenTextBVal, swInfoTextVal, screenColorAVal, screenColorBVal, bankState
                    ] = buttonMatch;
                    if (buttonNum < 1 || buttonNum > 6) continue;
                    const modeValue = modeMap[modeNum] || 'single';
                    const settings = buttonSettings[currentBank][buttonNum] || {};
                    settings.mode = modeValue;
                    settings.messageType = { a: typeA || 'PC', b: typeB || 'PC' };
                    settings.channel = { a: parseInt(channelA) || 1, b: parseInt(channelB) || 1 };
                    settings.data = { a: parseInt(data1A) || 0, b: parseInt(data1B) || 0 };
                    settings.value = { a: parseInt(valueAOpt) || 0, b: parseInt(valueBOpt) || 0 };
                    settings.screenText = { 
                        a: screenTextAVal.trim() || `SW-${buttonNum} A`, 
                        b: screenTextBVal.trim() || (modeValue === 'single' ? screenTextAVal.trim() : `SW-${buttonNum} B`) 
                    };
                    if (typeA === 'CC') {
                        settings.ccMessages.a[0].control = parseInt(data1A) || 0;
                        settings.ccMessages.a[0].value = parseInt(valueAOpt) || 0;
                    }
                    if (typeB === 'CC') {
                        settings.ccMessages.b[0].control = parseInt(data1B) || 0;
                        settings.ccMessages.b[0].value = parseInt(valueBOpt) || 0;
                    }
                    buttonColors[currentBank][buttonNum] = { a: `#${screenColorAVal}`, b: `#${screenColorBVal}` };
                    buttonBankStates[currentBank][buttonNum] = bankState;
                    swInfoTexts[currentBank][buttonNum] = swInfoTextVal.trim() || `SW-${buttonNum}`;
                    buttonSettings[currentBank][buttonNum] = settings;
                    console.log(`DEBUG: Processed button ${buttonNum}: swInfoText=${swInfoTexts[currentBank][buttonNum]}, colorA=${buttonColors[currentBank][buttonNum].a}, colorB=${buttonColors[currentBank][buttonNum].b}`);
                }
                showAlert('โหลดการตั้งค่าสำเร็จ!', 'success');
                pendingResponse = null;
                updateUI();
                const activeBtn = document.querySelector(`.button[data-button="${currentButtonNum}"]`);
                if (activeBtn) selectButton(activeBtn);
            } else {
                console.log('DEBUG: Unrecognized data:', text);
            }
        }

        // === Save Settings ===
        async function saveSettings() {
            if (!isConnected && !bluetoothConnected) {
                showAlert('กรุณาเชื่อมต่อ Serial หรือ Bluetooth', 'error');
                return false;
            }
            if (!activeButton) {
                showAlert('กรุณาเลือกปุ่ม', 'error');
                return false;
            }
            const buttonValue = activeButton.getAttribute('data-button');
            const settings = buttonSettings[currentBank][buttonValue];
            const bankNum = currentBank.replace('Bank ', '');
            const modeNum = Object.keys(modeMap).find(key => modeMap[key] === settings.mode) || '1';
            const midiTypeA = settings.messageType.a.toUpperCase();
            const midiTypeB = settings.messageType.b.toUpperCase();
            const channelAVal = parseInt(settings.channel.a) || 1;
            const channelBVal = parseInt(settings.channel.b) || 1;
            const dataAVal = midiTypeA === 'CC' ? (parseInt(settings.ccMessages.a[0].control) || 0) : (parseInt(settings.data.a) || 0);
            const dataBVal = midiTypeB === 'CC' ? (parseInt(settings.ccMessages.b[0].control) || 0) : (parseInt(settings.data.b) || 0);
            const valueAVal = midiTypeA === 'CC' ? (parseInt(settings.ccMessages.a[0].value) || 0) : (parseInt(settings.value.a) || 0);
            const valueBVal = midiTypeB === 'CC' ? (parseInt(settings.ccMessages.b[0].value) || 0) : (parseInt(settings.value.b) || 0);
            const screenTextAVal = (settings.screenText.a || `SW-${buttonValue} A`).trim().replace(/"/g, '').replace(/,/g, '');
            const screenTextBVal = (settings.screenText.b || (modeNum === '1' ? screenTextAVal : `SW-${buttonValue} B`)).trim().replace(/"/g, '').replace(/,/g, '');
            const swInfoTextVal = (swInfoTexts[currentBank][buttonValue] || `SW-${buttonValue}`).trim().replace(/"/g, '').replace(/,/g, '');
            const screenColorAVal = (buttonColors[currentBank][buttonValue].a || '#FFFF00').slice(1).toUpperCase();
            const screenColorBVal = (buttonColors[currentBank][buttonValue].b || '#FFFF00').slice(1).toUpperCase();

            // Validate inputs
            if (dataAVal < 0 || dataAVal > 127 || dataBVal < 0 || dataBVal > 127 ||
                valueAVal < 0 || valueAVal > 127 || valueBVal < 0 || valueBVal > 127) {
                showAlert('ข้อมูล MIDI ต้องอยู่ระหว่าง 0-127', 'error');
                return false;
            }
            if (channelAVal < 1 || channelAVal > 16 || channelBVal < 1 || channelBVal > 16) {
                showAlert('ช่อง MIDI ต้องอยู่ระหว่าง 1-16', 'error');
                return false;
            }
            if (screenTextAVal.length > 15 || screenTextBVal.length > 15 || swInfoTextVal.length > 15) {
                showAlert('ข้อความต้องไม่เกิน 15 ตัวอักษร', 'error');
                return false;
            }
            if (!screenColorAVal.match(/^[0-9A-F]{6}$/) || !screenColorBVal.match(/^[0-9A-F]{6}$/)) {
                showAlert('รูปแบบสีไม่ถูกต้อง ต้องเป็นรหัส HEX 6 หลัก', 'error');
                return false;
            }

            // Build command
            let cmd = `B ${bankNum} S ${buttonValue} MODE ${modeNum}`;
            cmd += ` BANK A ${midiTypeA} ${dataAVal}`;
            if (midiTypeA !== 'PC') cmd += ` ${valueAVal}`;
            cmd += ` CHANNEL_A ${channelAVal}`;
            if (modeNum !== '1') {
                cmd += ` BANK B ${midiTypeB} ${dataBVal}`;
                if (midiTypeB !== 'PC') cmd += ` ${valueBVal}`;
                cmd += ` CHANNEL_B ${channelBVal}`;
            }
            cmd += ` SCREEN_TEXT_A "${screenTextAVal}"`;
            cmd += ` SCREEN_TEXT_B "${screenTextBVal}"`;
            cmd += ` SW_INFO_TEXT "${swInfoTextVal}"`;
            cmd += ` SCREEN_COLOR_A ${screenColorAVal} SCREEN_COLOR_B ${screenColorBVal}\n`;

            console.log('DEBUG: Generated command:', cmd);

            try {
                const success = await sendCommand(cmd, bluetoothConnected, 'SET_OK');
                if (success) {
                    showAlert('กำลังบันทึกการตั้งค่า...', 'info');
                    return true;
                } else {
                    showAlert('ไม่สามารถบันทึกการตั้งค่าได้: ไม่ได้รับการตอบกลับจาก ESP32', 'error');
                    return false;
                }
            } catch (error) {
                showAlert(`ข้อผิดพลาดในการบันทึก: ${error.message}`, 'error');
                console.error('DEBUG: Save settings error:', error);
                return false;
            }
        }

        Object.values(swInfoTextInputs).forEach(input => {
            input.addEventListener('change', async () => {
                const buttonNum = input.id.replace('swInfoText', '');
                const newText = input.value.trim() || `SW-${buttonNum}`;
                swInfoTexts[currentBank][buttonNum] = newText;
                const bankNum = currentBank.replace('Bank ', '');
                const command = `B ${bankNum} S ${buttonNum} SW_INFO_TEXT "${newText}"\n`;
                await sendCommand(command, bluetoothConnected, 'SET_OK');
                console.log(`DEBUG: Changed swInfoText for button ${buttonNum}: ${newText}`);
                updateUI();
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            const button5 = document.querySelector('.button[data-button="5"]');
            if (button5) selectButton(button5);
            updateBankBVisibility();
            updateUI();
        });
    </script>
</body>
</html>
